shell = "/bin/zsh"

[window]
startup_mode = "Windowed"
dynamic_padding = true
dimensions = { columns = 128, lines = 36 }

[font]
normal = { family = "FiraCode Nerd Font Mono", style = "Medium" }
size = 14
builtin_box_drawing = true
# size = 26


